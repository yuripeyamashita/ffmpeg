
name: Build FFmpeg ARM64 Hardware First

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Build FFmpeg
        shell: bash
        run: |
          set -e
          mkdir -p dist

          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/out" \
            alpine:3.22 sh -euxc '
              apk add --no-cache \
                build-base \
                linux-headers \
                pkgconf \
                binutils \
                curl \
                tar \
                xz

              # Build static Opus
              cd /tmp

              curl -fL --retry 3 \
                https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz \
                -o opus.tar.gz

              tar -xzf opus.tar.gz
              cd opus-1.5.2

              ./configure \
                --prefix=/opt/static \
                --enable-static \
                --disable-shared

              make -j"$(nproc)"
              make install

              test -f /opt/static/lib/libopus.a

              export PKG_CONFIG_PATH=/opt/static/lib/pkgconfig
              export PKG_CONFIG_LIBDIR=/opt/static/lib/pkgconfig

              # Build FFmpeg
              cd /tmp

              curl -fL --retry 3 \
                https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz \
                -o ffmpeg.tar.xz

              tar -xJf ffmpeg.tar.xz
              cd ffmpeg-9.0.2

              ./configure \
                --enable-static \
                --disable-shared \
                --disable-everything \
                --disable-doc \
                --disable-debug \
                --disable-ffplay \
                --disable-ffprobe \
                --disable-avdevice \
                --enable-network \
                --enable-pthreads \
                --enable-libopus \
                --enable-decoder=h264,h264_v4l2m2m,hevc,mjpeg \
                --enable-decoder=aac,opus,pcm_alaw,pcm_mulaw,pcm_s16le,pcm_s16be \
                --enable-encoder=h264_v4l2m2m,mjpeg,rawvideo \
                --enable-encoder=aac,libopus,pcm_alaw,pcm_mulaw,pcm_s16le,pcm_s16be \
                --enable-parser=h264,hevc,aac,mjpeg,opus \
                --enable-demuxer=rtsp,rtp,sdp,h264,hevc \
                --enable-demuxer=mov,mpegts,flv,mp3,aac,ogg,wav,mjpeg,image2 \
                --enable-muxer=rtsp,rtp,mpegts,flv,mp4,null \
                --enable-muxer=image2,image2pipe,mjpeg,yuv4mpegpipe,adts,wav,ogg \
                --enable-protocol=file,pipe,tcp,udp,rtp,http,httpproxy \
                --enable-filter=scale,fps,format,transpose,crop \
                --enable-filter=aresample,aformat,anull,null,volume \
                --pkg-config-flags=--static \
                --extra-cflags="-I/opt/static/include" \
                --extra-ldflags="-static -L/opt/static/lib"

              make -j"$(nproc)"

              # Validate essential decoders
              ./ffmpeg -hide_banner -decoders > /tmp/decoders.txt
              ./ffmpeg -hide_banner -encoders > /tmp/encoders.txt
              ./ffmpeg -hide_banner -muxers > /tmp/muxers.txt
              ./ffmpeg -hide_banner -demuxers > /tmp/demuxers.txt
              ./ffmpeg -hide_banner -protocols > /tmp/protocols.txt
              ./ffmpeg -hide_banner -filters > /tmp/filters.txt

              for codec in h264 h264_v4l2m2m hevc mjpeg aac opus pcm_alaw pcm_mulaw; do
                grep -Eq "^[[:space:]]*[^[:space:]]+[[:space:]]+$codec[[:space:]]" /tmp/decoders.txt
              done

              for codec in h264_v4l2m2m mjpeg aac libopus pcm_alaw pcm_mulaw; do
                grep -Eq "^[[:space:]]*[^[:space:]]+[[:space:]]+$codec[[:space:]]" /tmp/encoders.txt
              done

              for format in rtsp rtp image2pipe mjpeg adts wav; do
                grep -Eq "^[[:space:]]*E[[:space:]]+$format[[:space:]]" /tmp/muxers.txt
              done

              grep -Eq "^[[:space:]]*D[[:space:]]+rtsp[[:space:]]" /tmp/demuxers.txt

              for filter in scale fps format aresample transpose; do
                grep -Eq "^[[:space:]]*[^[:space:]]+[[:space:]]+$filter[[:space:]]" /tmp/filters.txt
              done

              # Confirm unwanted software encoders are absent
              if grep -Eq "^[[:space:]]*[^[:space:]]+[[:space:]]+(libx264|libx265)[[:space:]]" /tmp/encoders.txt; then
                echo "ERROR: Unwanted software encoder found"
                exit 1
              fi

              # Confirm target architecture and static linkage
              readelf -h ffmpeg | grep AArch64

              if readelf -l ffmpeg | grep -q INTERP; then
                echo "ERROR: Dynamic interpreter detected"
                exit 1
              fi

              if readelf -d ffmpeg | grep -q NEEDED; then
                echo "ERROR: Dynamic dependencies detected"
                exit 1
              fi

              ./ffmpeg -hide_banner -version

              cp ffmpeg /out/ffmpeg
              chmod 755 /out/ffmpeg
            '

      - name: Verify ARM64 binary
        run: |
          file dist/ffmpeg
          readelf -h dist/ffmpeg | grep AArch64
          ls -lh dist/ffmpeg
          ./dist/ffmpeg -hide_banner -version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-openwrt-arm64-hardware
          path: dist/ffmpeg
          retention-days: 30
          if-no-files-found: error
